<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner — Organize Your Learning</title>
    <meta name="description" content="A modern study planner to manage subjects, tasks, and study sessions.">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Background blobs -->
    <div class="bg-effects">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-brand">
            <i class="ri-book-read-fill"></i>
            <span>StudyPlanner</span>
        </div>
        <div class="nav-right">
            <span class="nav-greeting" id="nav-greeting">Welcome, Student</span>
        </div>
    </nav>

    <!-- Main Dashboard -->
    <div class="dashboard" id="dashboard">

        <!-- Sidebar: Subjects -->
        <aside class="sidebar glass" id="sidebar">
            <div class="sidebar-top">
                <h2><i class="ri-folders-line"></i> Subjects</h2>
                <button class="icon-btn" id="btn-add-subject" title="Add Subject">
                    <i class="ri-add-circle-line"></i>
                </button>
            </div>
            <ul class="subject-list" id="subject-list">
                <!-- Populated by JS -->
            </ul>
            <div class="sidebar-empty" id="sidebar-empty">
                <i class="ri-inbox-unarchive-line"></i>
                <p>No subjects yet.<br>Click <strong>+</strong> to add one.</p>
            </div>
        </aside>

        <!-- Main Panel -->
        <main class="main-panel">

            <!-- Header Card -->
            <section class="header-card glass" id="header-card">
                <div class="header-left">
                    <h1 id="header-title">Welcome to Study Planner</h1>
                    <p id="header-subtitle">Select or create a subject to get started.</p>
                </div>
                <div class="header-right" id="session-area" style="display:none;">
                    <button class="btn btn-success" id="btn-start-session">
                        <i class="ri-play-circle-fill"></i> Start Session
                    </button>
                    <div class="live-session" id="live-session" style="display:none;">
                        <span class="pulse"></span>
                        <span class="timer" id="timer">00:00:00</span>
                        <button class="btn btn-danger btn-sm" id="btn-end-session">
                            <i class="ri-stop-circle-fill"></i> Stop
                        </button>
                    </div>
                </div>
            </section>

            <!-- Tasks Card -->
            <section class="tasks-card glass" id="tasks-card">
                <div class="tasks-top">
                    <h2><i class="ri-task-line"></i> Tasks</h2>
                    <button class="btn btn-primary btn-sm" id="btn-add-task" disabled>
                        <i class="ri-add-line"></i> New Task
                    </button>
                </div>
                <div class="task-list" id="task-list">
                    <div class="empty-state" id="tasks-empty">
                        <i class="ri-clipboard-line"></i>
                        <p>Select a subject to see its tasks.</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal: Add Subject -->
    <div class="modal-overlay" id="modal-subject">
        <div class="modal glass">
            <div class="modal-head">
                <h2>New Subject</h2>
                <button class="icon-btn close-modal"><i class="ri-close-line"></i></button>
            </div>
            <form id="form-subject">
                <div class="field">
                    <label for="inp-subject-name">Subject Name</label>
                    <input type="text" id="inp-subject-name" placeholder="e.g. Mathematics" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <i class="ri-add-line"></i> Create Subject
                </button>
            </form>
        </div>
    </div>

    <!-- Modal: Add Task -->
    <div class="modal-overlay" id="modal-task">
        <div class="modal glass">
            <div class="modal-head">
                <h2>New Task</h2>
                <button class="icon-btn close-modal"><i class="ri-close-line"></i></button>
            </div>
            <form id="form-task">
                <div class="field">
                    <label for="inp-task-title">Task Title</label>
                    <input type="text" id="inp-task-title" placeholder="e.g. Read Chapter 5" required>
                </div>
                <div class="field">
                    <label for="inp-task-desc">Description (optional)</label>
                    <textarea id="inp-task-desc" rows="3" placeholder="Any notes..."></textarea>
                </div>
                <div class="field">
                    <label for="inp-task-deadline">Deadline (optional)</label>
                    <input type="date" id="inp-task-deadline">
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <i class="ri-add-line"></i> Create Task
                </button>
            </form>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
